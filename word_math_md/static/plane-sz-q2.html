<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>第2题 · 分段函数求值</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css"/>
  <link rel="stylesheet" href="/static/plane-scene.css?v=3"/>
  <style>
    body.plane-embed .kicker,
    body.plane-embed h1,
    body.plane-embed .lead { display: none; }
  </style>
</head>
<body class="plane-page">
  <script>if (location.search.indexOf("embed=1") >= 0) document.body.classList.add("plane-embed");</script>
  <main>
    <p class="kicker">函数的概念</p>
    <h1>第2题 · 分段函数求值</h1>
    <p class="lead">
      f(x) 在 x ≤ 1 时是 x² - 1，在 x &gt; 1 时是 1/(x - 1)。按详解，先算 f(3)，再把结果代回对应的那一段。
    </p>
    <div id="stage">正在加载演示…</div>
  </main>
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/static/plane-scene.js?v=8"></script>
  <script>
    fetch("/static/scenes/sz-q2-piecewise.json")
      .then(function (res) {
        if (!res.ok) throw new Error("场景加载失败");
        return res.json();
      })
      .then(function (scene) {
        document.getElementById("stage").textContent = "";
        window.PlanePlayer.mount(document.getElementById("stage"), scene);
      })
      .catch(function (err) {
        const stage = document.getElementById("stage");
        stage.className = "plane-error";
        stage.textContent = err && err.message ? err.message : "场景加载失败";
      });
  </script>
</body>
</html>
