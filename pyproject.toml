[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-math-md"
version = "0.1.0"
description = "MathDoc Converter — Word (OMML / MathType / WMF/EMF) → Markdown + LaTeX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MathDoc Converter" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "lxml>=5.0",
  "python-docx>=1.1",
  "mammoth>=1.8",
  "Pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "markdown>=3.5",
  "olefile>=0.47",
  "mathml2latex>=0.2",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
aspose = ["aspose-words>=24.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
word-math-md = "word_math_md.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["word_math_md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
